server {
    listen 80;
    server_name your-vps-domain.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-vps-domain.com;

    # TLS — obtain certificates with: certbot --nginx -d your-vps-domain.com
    ssl_certificate     /etc/letsencrypt/live/your-vps-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-vps-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/chatbot;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Cache-bust the HTML so users always get the latest WS_URL
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gzip static assets
    gzip on;
    gzip_types text/html text/css application/javascript;
}
