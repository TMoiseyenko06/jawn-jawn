<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice AI Chatbot</title>
<style>
  /* ===== Reset & base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --accent:   #6c63ff;
    --accent2:  #ff6584;
    --user-bg:  #2a2560;
    --bot-bg:   #1e2230;
    --text:     #e2e4ef;
    --subtext:  #7b7f96;
    --red:      #ff4c6a;
    --green:    #3ecf8e;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  /* ===== Layout ===== */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .02em;
  }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--subtext);
    transition: background .3s;
    flex-shrink: 0;
  }
  #status-dot.connected    { background: var(--green); }
  #status-dot.disconnected { background: var(--red); }

  #status-label {
    font-size: .78rem;
    color: var(--subtext);
    margin-left: auto;
  }

  /* ===== Voice clone bar ===== */
  #voice-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: .8rem;
  }

  #voice-bar label {
    color: var(--subtext);
    white-space: nowrap;
  }

  #voice-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #23263a;
    border: 1px solid var(--border);
    font-size: .78rem;
    color: var(--subtext);
    transition: border-color .2s, color .2s;
    white-space: nowrap;
  }
  #voice-chip.cloning  { color: #f5a623; border-color: #f5a623; }
  #voice-chip.ready    { color: var(--green); border-color: var(--green); }
  #voice-chip.failed   { color: var(--red); border-color: var(--red); }

  #voice-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  #voice-chip.cloning .dot {
    animation: pulse-dot 1s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: .3; }
  }

  #clone-btn {
    width: auto; height: auto;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: .78rem;
    background: #23263a;
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  #clone-btn:hover { background: #2e3148; border-color: var(--accent); color: var(--accent); }

  #clear-voice-btn {
    width: auto; height: auto;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: .78rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--subtext);
    cursor: pointer;
    transition: border-color .2s, color .2s;
    display: none;
    white-space: nowrap;
  }
  #clear-voice-btn:hover { border-color: var(--red); color: var(--red); }
  #clear-voice-btn.visible { display: block; }

  /* ===== Messages ===== */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 78%;
  }
  .msg-row.user  { align-self: flex-end;  flex-direction: row-reverse; }
  .msg-row.bot   { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .user .avatar { background: var(--accent); }
  .bot  .avatar { background: #2e3148; }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .user .bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: var(--bot-bg);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }

  /* Typing indicator */
  .typing-dots span {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--subtext);
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-6px); }
  }

  /* Speaking indicator */
  #speaking-bar {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: var(--accent);
    padding: 4px 0 0 42px;
  }
  #speaking-bar.active { display: flex; }
  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.9s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 14px; animation-delay: .15s; }
  .wave-bar:nth-child(3) { height: 10px; animation-delay: .3s; }
  .wave-bar:nth-child(4) { height: 16px; animation-delay: .45s; }
  .wave-bar:nth-child(5) { height: 8px;  animation-delay: .6s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(1); }
    50%       { transform: scaleY(2); }
  }

  /* ===== Input bar ===== */
  #input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 22px;
    color: var(--text);
    padding: 9px 16px;
    font-size: .92rem;
    outline: none;
    transition: border-color .2s;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input::placeholder { color: var(--subtext); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 50%;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  button:active { transform: scale(.93); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #send-btn {
    background: var(--accent);
    color: #fff;
  }
  #send-btn:hover:not(:disabled) { background: #7c73ff; }

  #mic-btn {
    background: #2a2d3a;
    color: var(--text);
    position: relative;
  }
  #mic-btn:hover:not(:disabled) { background: #33374a; }
  #mic-btn.recording {
    background: var(--red);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,76,106,.5); }
    50%       { box-shadow: 0 0 0 10px rgba(255,76,106,0); }
  }

  /* Recording label */
  #rec-label {
    font-size: .76rem;
    color: var(--red);
    display: none;
    flex-shrink: 0;
  }
  #rec-label.active { display: block; }

  /* Reconnect overlay */
  #reconnect-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #reconnect-overlay.active { display: flex; }
  #reconnect-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 36px;
    text-align: center;
    display: flex; flex-direction: column; gap: 16px;
  }
  #reconnect-box p { color: var(--subtext); }
  #reconnect-btn {
    width: auto; height: auto;
    border-radius: 22px;
    padding: 10px 28px;
    font-size: .95rem;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  #reconnect-btn:hover { background: #7c73ff; }
</style>
</head>
<body>

<script>
  // Auto-detect WebSocket URL from the page origin — works behind any proxy or tunnel.
  // Override by setting WS_URL manually if needed, e.g.:
  //   const WS_URL = "wss://your-tunnel.trycloudflare.com/ws";
  const WS_URL = location.origin.replace(/^http/, 'ws') + '/ws';
  const MAX_NEW_TOKENS = 512;
  const TEMPERATURE    = 0.7;
</script>

<div id="app">
  <header>
    <div id="status-dot" class="disconnected"></div>
    <h1>Voice AI</h1>
    <span id="status-label">Connecting…</span>
  </header>

  <!-- Voice clone bar -->
  <div id="voice-bar">
    <label>Voice:</label>
    <div id="voice-chip"><div class="dot"></div><span id="voice-chip-text">Default (Jenny)</span></div>
    <button id="clone-btn" title="Upload a voice reference clip to clone">+ Clone voice</button>
    <button id="clear-voice-btn" title="Remove voice clone, revert to default">✕ Clear</button>
    <input id="voice-file-input" type="file" accept="audio/*" style="display:none" />
  </div>

  <div id="messages"></div>

  <!-- Speaking indicator (outside messages so it stays visible) -->
  <div id="speaking-bar">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    Speaking…
  </div>

  <div id="input-bar">
    <button id="mic-btn" title="Hold to record">🎤</button>
    <span id="rec-label">● Recording…</span>
    <input id="text-input" type="text" placeholder="Type a message or hold mic to speak…" autocomplete="off" />
    <button id="send-btn" title="Send">➤</button>
  </div>
</div>

<div id="reconnect-overlay">
  <div id="reconnect-box">
    <h2>Disconnected</h2>
    <p>Lost connection to the server.</p>
    <button id="reconnect-btn">Reconnect</button>
  </div>
</div>

<script>
// =====================================================================
// Session ID — persists across refreshes, cleared when browser storage is wiped
// =====================================================================
function getSessionId() {
  let id = localStorage.getItem('jawn_session_id');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('jawn_session_id', id);
  }
  return id;
}
const SESSION_ID = getSessionId();

// =====================================================================
// State
// =====================================================================
let ws = null;
let busy = false;              // true while server is processing a turn
let currentBotBubble = null;   // DOM element for the in-progress bot message
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

// Audio playback queue
let audioQueue = [];
let isPlaying = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// DOM refs
const messagesEl   = document.getElementById("messages");
const textInput    = document.getElementById("text-input");
const sendBtn      = document.getElementById("send-btn");
const micBtn       = document.getElementById("mic-btn");
const recLabel     = document.getElementById("rec-label");
const statusDot    = document.getElementById("status-dot");
const statusLabel  = document.getElementById("status-label");
const reconnectOverlay = document.getElementById("reconnect-overlay");
const reconnectBtn = document.getElementById("reconnect-btn");
const speakingBar  = document.getElementById("speaking-bar");

// =====================================================================
// WebSocket
// =====================================================================
function connect() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    setStatus("connected", "Connected");
    reconnectOverlay.classList.remove("active");
    // Send config handshake with session ID for memory persistence
    ws.send(JSON.stringify({
      type: "config",
      max_tokens: MAX_NEW_TOKENS,
      temperature: TEMPERATURE,
      session_id: SESSION_ID,
    }));
  };

  ws.onclose = () => {
    setStatus("disconnected", "Disconnected");
    reconnectOverlay.classList.add("active");
    finalizeBotBubble();
    setBusy(false);
  };

  ws.onerror = () => {
    setStatus("disconnected", "Error");
  };

  ws.onmessage = handleMessage;
}

function handleMessage(event) {
  const data = event.data;

  if (typeof data === "string") {
    if (data === "[END]") {
      finalizeBotBubble();
      setBusy(false);
      return;
    }

    if (data.startsWith("AUDIO:")) {
      const b64 = data.slice(6);
      enqueueAudio(b64);
      return;
    }

    // Try JSON
    try {
      const msg = JSON.parse(data);

      if (msg.type === "transcript") {
        // Replace the "transcribing…" placeholder in last user bubble
        updateLastUserBubble(msg.text);
        return;
      }

      if (msg.type === "token") {
        appendToken(msg.text);
        return;
      }

      if (msg.type === "voice_status") {
        if (msg.status === "cloning") {
          setVoiceChip("cloning", "Cloning…");
        } else if (msg.status === "ready") {
          setVoiceChip("ready", "Cloned voice ✓");
        } else if (msg.status === "failed") {
          setVoiceChip("failed", "Clone failed — using default");
          setTimeout(() => setVoiceChip("default", "Default (Jenny)"), 3000);
        } else if (msg.status === "cleared") {
          setVoiceChip("default", "Default (Jenny)");
        }
        return;
      }
    } catch (_) { /* not JSON, ignore */ }
  }
}

// =====================================================================
// UI helpers
// =====================================================================
function setStatus(cls, label) {
  statusDot.className = cls;
  statusLabel.textContent = label;
}

function setBusy(b) {
  busy = b;
  sendBtn.disabled = b;
  micBtn.disabled  = b;
  textInput.disabled = b;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text, isPlaceholder = false) {
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "🧑" : "🤖";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (isPlaceholder) {
    bubble.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;
  } else {
    bubble.textContent = text;
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}

function updateLastUserBubble(text) {
  // The most recent user row
  const rows = messagesEl.querySelectorAll(".msg-row.user");
  if (rows.length === 0) return;
  const lastBubble = rows[rows.length - 1].querySelector(".bubble");
  if (lastBubble) lastBubble.textContent = text;
}

function startBotBubble() {
  currentBotBubble = addMessage("bot", "", true /* typing indicator */);
  // Will be filled by appendToken
}

function appendToken(token) {
  if (!currentBotBubble) {
    startBotBubble();
  }
  // Remove typing indicator on first real token
  const dots = currentBotBubble.querySelector(".typing-dots");
  if (dots) dots.remove();

  currentBotBubble.textContent += token;
  scrollBottom();
}

function finalizeBotBubble() {
  if (currentBotBubble) {
    // Remove typing indicator if still there (e.g., empty response)
    const dots = currentBotBubble.querySelector(".typing-dots");
    if (dots) dots.remove();
    if (!currentBotBubble.textContent.trim()) {
      currentBotBubble.textContent = "(no response)";
    }
    currentBotBubble = null;
  }
}

// =====================================================================
// Send helpers
// =====================================================================
function sendText(text) {
  if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN || busy) return;
  setBusy(true);
  addMessage("user", text);
  startBotBubble();
  ws.send(JSON.stringify({ type: "text", content: text }));
  textInput.value = "";
}

// =====================================================================
// Audio recording (mic button)
// =====================================================================
micBtn.addEventListener("mousedown",  startRecording);
micBtn.addEventListener("touchstart", startRecording, { passive: true });
micBtn.addEventListener("mouseup",    stopRecording);
micBtn.addEventListener("touchend",   stopRecording);

async function startRecording(e) {
  e.preventDefault();
  if (busy || isRecording) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
    audioChunks = [];
    mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) audioChunks.push(ev.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add("recording");
    recLabel.classList.add("active");
  } catch (err) {
    console.error("Mic error:", err);
    alert("Could not access microphone: " + err.message);
  }
}

function stopRecording(e) {
  e.preventDefault();
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
  micBtn.classList.remove("recording");
  recLabel.classList.remove("active");
}

function onRecordingStop() {
  if (!audioChunks.length) return;
  const blob = new Blob(audioChunks, { type: "audio/webm" });

  setBusy(true);
  // Show placeholder user bubble (will be replaced by transcript)
  const bubble = addMessage("user", "Transcribing…");
  startBotBubble();

  blob.arrayBuffer().then(buf => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(buf);
    }
  });
}

// =====================================================================
// Text send
// =====================================================================
sendBtn.addEventListener("click", () => sendText(textInput.value));
textInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendText(textInput.value);
  }
});

// =====================================================================
// Audio playback queue
// =====================================================================
function enqueueAudio(b64) {
  audioQueue.push(b64);
  if (!isPlaying) drainAudioQueue();
}

async function drainAudioQueue() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    speakingBar.classList.remove("active");
    return;
  }
  isPlaying = true;
  speakingBar.classList.add("active");

  const b64 = audioQueue.shift();
  try {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    const decoded = await audioCtx.decodeAudioData(bytes.buffer);
    const source = audioCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(audioCtx.destination);
    source.onended = () => drainAudioQueue();
    source.start(0);
  } catch (err) {
    console.warn("Audio decode error:", err);
    drainAudioQueue(); // skip broken chunk
  }
}

// Unlock AudioContext on first user gesture (browser autoplay policy)
document.addEventListener("click",     () => audioCtx.state === "suspended" && audioCtx.resume(), { once: true });
document.addEventListener("touchstart",() => audioCtx.state === "suspended" && audioCtx.resume(), { once: true });

// =====================================================================
// Voice cloning
// =====================================================================
const cloneBtn       = document.getElementById("clone-btn");
const clearVoiceBtn  = document.getElementById("clear-voice-btn");
const voiceFileInput = document.getElementById("voice-file-input");
const voiceChip      = document.getElementById("voice-chip");
const voiceChipText  = document.getElementById("voice-chip-text");

cloneBtn.addEventListener("click", () => voiceFileInput.click());

voiceFileInput.addEventListener("change", () => {
  const file = voiceFileInput.files[0];
  if (!file) return;
  voiceFileInput.value = "";   // allow re-selecting same file

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    alert("Not connected — please wait for the connection before uploading a voice clip.");
    return;
  }

  setVoiceChip("cloning", "Cloning…");

  const reader = new FileReader();
  reader.onload = () => {
    // reader.result is ArrayBuffer → convert to base64
    const bytes = new Uint8Array(reader.result);
    let binary  = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    const b64 = btoa(binary);
    ws.send(JSON.stringify({ type: "voice_ref", audio: b64 }));
  };
  reader.readAsArrayBuffer(file);
});

clearVoiceBtn.addEventListener("click", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "clear_voice" }));
  }
  setVoiceChip("default", "Default (Jenny)");
});

function setVoiceChip(state, text) {
  voiceChip.className   = "";   // reset
  voiceChipText.textContent = text;
  if (state === "cloning") {
    voiceChip.classList.add("cloning");
    clearVoiceBtn.classList.remove("visible");
    cloneBtn.textContent = "Cloning…";
    cloneBtn.disabled    = true;
  } else if (state === "ready") {
    voiceChip.classList.add("ready");
    clearVoiceBtn.classList.add("visible");
    cloneBtn.textContent = "+ Replace";
    cloneBtn.disabled    = false;
  } else if (state === "failed") {
    voiceChip.classList.add("failed");
    clearVoiceBtn.classList.remove("visible");
    cloneBtn.textContent = "+ Clone voice";
    cloneBtn.disabled    = false;
  } else {
    // default
    clearVoiceBtn.classList.remove("visible");
    cloneBtn.textContent = "+ Clone voice";
    cloneBtn.disabled    = false;
  }
}

// =====================================================================
// Reconnect
// =====================================================================
reconnectBtn.addEventListener("click", () => {
  reconnectOverlay.classList.remove("active");
  setVoiceChip("default", "Default (Jenny)");
  connect();
});

// =====================================================================
// Boot
// =====================================================================
connect();
</script>
</body>
</html>
